[project]
name = "riff-lab"
version = "0.1.0"
description = ""
authors = [
    {name = "ChKhaled",email = "ckhaledpro@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    "pyside6 (>=6.12.0,<7.0.0)"
]

[tool.poetry]
packages = [{include = "riff_lab", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.17.0,<0.18.0)"
]
